<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/New new icon.png?v=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#08171a" />
    <meta name="description" content="Supershyft — health scanning, risk analysis, and wellness." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Supershyft" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/New new icon.png?v=1" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json?v=5" />
    <!--
      Google Fonts — Lato, Sora, DM Sans.
      Loaded via the preload + onload swap pattern so the external stylesheet
      never blocks the first paint. `display=swap` on the URL keeps system
      fonts visible until the web fonts arrive, which matches the original
      visual behavior. The <noscript> fallback preserves styling for users
      with JS disabled.
    -->
    <!--
      LCP request discovery: BG-1.png is the full-viewport background the user
      sees on first paint, so we preload it directly from the HTML. Without
      this the browser has to parse main.css before it even learns the URL
      exists, forcing a 3-hop critical chain (html -> css -> image). Preloading
      with fetchpriority=high flattens that to html -> image in parallel with
      html -> css and is the single biggest LCP lever on this app.
    -->
    <link
      rel="preload"
      as="image"
      href="%PUBLIC_URL%/BG-1.png"
      fetchpriority="high"
    >
    <!--
      Body/app background image is set here (not in src/*.css) because the
      hashed file lives under /public/ and CRA's css-loader tries to module-
      resolve absolute URLs it finds in stylesheets. %PUBLIC_URL% is replaced
      at build time, so this block resolves to a plain absolute URL in prod.
    -->
    <style>
      html,
      body {
        background-image: url('%PUBLIC_URL%/BG-1.png');
      }
      .app-background {
        background-image: url('%PUBLIC_URL%/BG-1.png');
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Lato:wght@300;400;500;600;700;900&family=Sora:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,200;9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@500&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    >
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Lato:wght@300;400;500;600;700;900&family=Sora:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,200;9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@500&display=swap"
      >
    </noscript>
    <!-- %PUBLIC_URL% is replaced at build time. -->
    <title>Supershyft</title>
  </head>
  <body>
    <noscript>Supershyft needs JavaScript enabled in your browser.</noscript>
    <div id="root"></div>
  </body>
</html>
